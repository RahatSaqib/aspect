services:
  redis:
    image: redis:7.4.0-alpine
    container_name: redis-aspect
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 15s
      retries: 1
    networks:
      - aspectnet

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-aspect
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5672"]
      interval: 5s
      timeout: 15s
      retries: 1
    networks:
      - aspectnet

  mysql:
    image: mysql:8.0.35
    container_name: mysql-aspect
    restart: always

    command: >
      --default_authentication_plugin=mysql_native_password
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      --default-time-zone=+00:00
      --innodb-buffer-pool-size=1G
      --disable-log-bin
      --innodb-strict-mode=0

    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: aspect
      TZ: UTC

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./.devcontainer/data/mysqld.cnf:/etc/mysql/my.cnf

    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      timeout: 20s
      retries: 10

    networks:
      - aspectnet

networks:
  aspectnet:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  rabbitmq_logs:
