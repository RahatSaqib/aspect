name: Run and test API on PR
'on': pull_request
jobs:
  Build-and-Test-API:
    runs-on: ubuntu-latest
    env:
      dbUser: 'root'
      dbPassword: 'rootpass'
      dbName: 'aspect'
      rabbitUser: 'guest'
      rabbitPassword: 'guest'
    steps:
      - name: 'Checkout repo'
        uses: actions/checkout@v2

      - name: 'Setup NODE'
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: 'Create env file'
        run: |
          cp -R ./api/.env.example ./api/.env

          echo admin.email='dpotgieter+ci@systemone.co' >> ./api/.env
          echo admin.cell='+79114946979' >> ./api/.env

          echo db.databaseName=$dbName >> ./api/.env
          echo db.user=$dbUser >> ./api/.env
          echo db.password=$dbPassword >> ./api/.env
          echo twilioAccountSid='should-be-gh-secret' >> ./api/.env
          echo twilioAuthToken='should-be-gh-secret' >> ./api/.env
          echo twilioFromNumber='should-be-gh-secret' >> ./api/.env
          echo twilioMessagingServiceSid='should-be-gh-secret' >> ./api/.env
          echo encryption.passPhrase='should-be-gh-secret' >> ./api/.env
          echo encryption.initVector='should-be-gh-secret' >> ./api/.env
          echo pushNotification.testDeviceTokenId='should-be-gh-secret' >> ./api/.env
          echo firebase.serverKey='should-be-gh-secret' >> ./api/.env

          echo db.connectionLimit=100 >> ./api/.env
          echo db.host=localhost >> ./api/.env
          echo db.debug=false >> ./api/.env
          echo passwordAttempts=5 >> ./api/.env
          echo passwordSaltRounds=10 >> ./api/.env
          echo gxAlertApi=https://admin.gxalert.com/api >> ./api/.env
          echo file.reference.directory='./files' >> ./api/.env
          echo amqp.url=amqp://localhost >> ./api/.env
          echo seeds.directory='./seeds/test/' >> ./api/.env
          echo seeds.resultMultiplier=2 >> ./api/.env
          echo email.host='smtp.sendgrid.net' >> ./api/.env
          echo email.port=2525 >> ./api/.env
          echo email.user=apikey >> ./api/.env
          echo email.fromEmail=support@gxalert.com >> ./api/.env
          echo aspectUrl=http://aspect.id >> ./api/.env
          echo swagger.enabled=false >> ./api/.env
          echo swagger.host=false >> ./api/.env
          echo useTwilio=true >> ./api/.env
          echo twilioFromNumber='+14423337971' >> ./api/.env
          echo plugin.commcare.apiKey=false >> ./api/.env
          echo scheduler.enabled=true >> ./api/.env
          echo webhook.redcap.url='asdf' >> ./api/.env
          echo webhook.redcap.authToken='jkasd' >> ./api/.env
          echo countryName='github-actions' >> ./api/.env

      - name: 'Setup MySQL'
        uses: haltuf/mysql-action@master
        with:
          character set server: 'utf8'
          collation server: 'utf8_general_ci'
          mysql version: '8.0'
          mysql database: $dbName
          mysql root password: $dbPassword
          authentication plugin: 'mysql_native_password'

      # - name: 'Setup RabbitMQ'
      #   uses: mer-team/rabbitmq-mng-action@v1.2
      #   with:
      #     RABBITMQ_USER: $rabbitUser
      #     RABBITMQ_PASS: $rabbitPassword
      #     RABBITMQ_PORT: 5672
      #     RABBITMQ_MNG_PORT: 15672
      #     RABBITMQ_TAG: '3-management-alpine'

      - uses: actions/cache@v2
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: 'Install Node Modules'
        run: 'yarn start:api:install'

      # - name: 'Seed DB & Run Migrations'
      #   run: yarn start:api:seed

      - name: 'Run Server'
        run: yarn start:api:bg

      # - name: 'Run API Contract Batch 1'
      #   run: yarn api:contract --spec test/{_setup,accountDetails,alert,assay,auth,case,consumable,dashboard,device,deviceApiKey,deviceApiRaw,deviceMaintenanceStatus,disease,excelReports,forms,geography,inventory,job,partner,patient,person,report,result,seedHelpers,server,shared,site,stringTemplate,tag,task,utils,issue, sms, webhook, email, notification, pushNotification,scheduler}/*.spec.js*

      # - name: 'Contract Test Report'
      #   uses: dorny/test-reporter@v1
      #   if: success() || failure()
      #   with:
      #     name: Contract Tests
      #     path: 'api/test-report.json'
      #     reporter: mocha-json
      #     token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Stop Server'
        run: yarn stop:api:bg
