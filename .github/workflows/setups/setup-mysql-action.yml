name: Spin up MySQL

inputs:
  dbName:
    required: true
    type: string
  dbPassword:
    required: true
    type: string

runs:
    using: 'composite'
    steps:
      - name: 'Setup MySQL'
        uses: haltuf/mysql-action@master
        with:
          character set server: 'utf8'
          collation server: 'utf8_general_ci'
          mysql version: '8.0'
          mysql database: ${{inputs.dbName}}
          mysql root password: ${{inputs.dbPassword}}
          authentication plugin: 'mysql_native_password'
