name: 'Backend .env'
description: 'Create and config backend .env file'
inputs:
  dbname:
    description: 'The name of the DB'
    required: true
  dbuser:
    description: 'The root user of the DB'
    required: true
  dbpassword:
    description: 'The root password for the DB'
    required: true
runs:
  using: "composite"
  steps:
    - name: 'Create env file'
      run: |
        cp -R ./api/.env.example ./api/.env

        echo admin.email='dpotgieter+ci@systemone.co' >> ./api/.env
        echo admin.cell='+79114946979' >> ./api/.env

        echo db.databaseName=$DB_NAME >> ./api/.env
        echo db.user=$DB_USER >> ./api/.env
        echo db.password=$DB_PASSWORD >> ./api/.env
        echo twilioAccountSid=${{ secrets.TWILIOACCOUNTSID }} >> ./api/.env
        echo twilioAuthToken=${{ secrets.TWILIOAUTHTOKEN }} >> ./api/.env
        echo twilioMessagingServiceSid=${{ secrets.TWILIOMESSAGINGSERVICESID }} >> ./api/.env
        echo encryption.passPhrase=${{ secrets.ENCRYPTIONPASSPHRASE }} >> ./api/.env
        echo encryption.initVector=${{ secrets.ENCRYPTIONINITVECTOR }} >> ./api/.env
        echo pushNotification.testDeviceTokenId=${{ secrets.PUSHNOTIFICATIONTESTDEVICETOKENID }} >> ./api/.env
        echo firebase.serverKey=${{ secrets.FIREBASESERVERKEY }} >> ./api/.env

        echo db.connectionLimit=100 >> ./api/.env
        echo db.host=localhost >> ./api/.env
        echo db.debug=false >> ./api/.env
        echo passwordAttempts=5 >> ./api/.env
        echo passwordSaltRounds=10 >> ./api/.env
        echo gxAlertApi=https://admin.gxalert.com/api >> ./api/.env
        echo file.reference.directory='./files' >> ./api/.env
        echo amqp.url=amqp://localhost >> ./api/.env
        echo seeds.directory='./seeds/test/' >> ./api/.env
        echo seeds.resultMultiplier=2 >> ./api/.env
        echo email.host='smtp.sendgrid.net' >> ./api/.env
        echo email.port=2525 >> ./api/.env
        echo email.user=apikey >> ./api/.env
        echo email.fromEmail=support@gxalert.com >> ./api/.env
        echo aspectUrl=http://aspect.id >> ./api/.env
        echo swagger.enabled=false >> ./api/.env
        echo swagger.host=false >> ./api/.env
        echo useTwilio=true >> ./api/.env
        echo twilioFromNumber='+14423337971' >> ./api/.env
        echo plugin.commcare.apiKey=false >> ./api/.env
        echo scheduler.enabled=true >> ./api/.env
        echo webhook.redcap.url='asdf' >> ./api/.env
        echo webhook.redcap.authToken='jkasd' >> ./api/.env
        echo countryName='github-actions' >> ./api/.env
      shell: bash
      env:
        DB_NAME: ${{ inputs.dbname }}
        DB_USER: ${{ inputs.dbuser }}
        DB_PASSWORD: ${{ inputs.dbpassword }}
