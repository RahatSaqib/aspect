name: 'Setup Aspect MySQL'
description: 'Setup a MySQL server'
inputs:
  dbname:
    description: 'The name of the DB'
    required: true
  dbpassword:
    description: 'The root password for the DB'
    required: true
runs:
  using: "composite"
  steps:
    - name: 'Setup MySQL'
      uses: haltuf/mysql-action@master
      with:
        character set server: 'utf8'
        collation server: 'utf8_general_ci'
        mysql version: '8.0'
        mysql database: $DB_NAME
        mysql root password: $DB_PASSWORD
        authentication plugin: 'mysql_native_password'
      env:
          DB_NAME: ${{ inputs.dbname }}
          DB_PASSWORD: ${{ inputs.dbpassword }}
