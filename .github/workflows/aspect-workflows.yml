  be-test:
    name: 'Back-end tests'
    runs-on: ubuntu-latest
    needs: be-install
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 'rootpass'
        ports:
        - 32574:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      matrix:
        Plan: [Unit,Contract]
    steps:
        - uses: actions/checkout@v3

        # - uses: ./.github/workflows/setups/back-end-Unit
