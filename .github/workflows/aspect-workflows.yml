name: Aspect

on:
  pull_request:
    # paths:
    #   - 
  workflow_dispatch:

env:
    dbname: 'root'
    dbuser: 'rootpass'
    dbpassword: 'aspect'
    rabbitUser: 'guest'
    rabbitPassword: 'guest'

jobs:
  fe-install:
    name: 'Front-end setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect
        uses: ./.github/workflows/setups/front-end-setup

  be-install:
    name: 'Backend setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect-backend
        uses: ./.github/workflows/setups/back-end-setup

  # fe-test:
  #   name: 'Front-end tests'
  #   runs-on: ubuntu-latest
  #   needs: fe-install
  #   strategy:
  #     matrix:
  #       Plan: [Web]
  #   steps:
  #     - uses: actions/checkout@v3
  #     - id: install-aspect
  #       uses: ./.github/workflows/setups/front-end-setup

  #     - name: 'Run Tests'
  #       run: yarn web:test

  be-tools:
    name: 'Backend tools'
    runs-on: ubuntu-latest
    needs: be-install
    strategy:
      matrix:
        Plan: [MySQL,RabbitMQ]
    steps:
      - name: 'Setup MySQL'
        uses: haltuf/mysql-action@master
        if: ${{ matrix.Plan == 'MySQL' }}
        with:
          character set server: 'utf8'
          collation server: 'utf8_general_ci'
          mysql version: '8.0'
          mysql database: $dbname
          mysql root password: $dbpassword
          authentication plugin: 'mysql_native_password'

      - name: 'Setup RabbitMQ'
        uses: mer-team/rabbitmq-mng-action@v1.2
        if: ${{ matrix.Plan == 'RabbitMQ' }}
        with:
          RABBITMQ_USER: $rabbitUser
          RABBITMQ_PASS: $rabbitPassword
          RABBITMQ_PORT: 5672
          RABBITMQ_MNG_PORT: 15672
          RABBITMQ_TAG: '3-management-alpine'

  be-test:
    name: 'Back-end tests'
    runs-on: ubuntu-latest
    needs: be-tools
    strategy:
      matrix:
        Plan: [Unit,Contract]
    steps:
        - uses: actions/checkout@v3
        
        - uses: ./.github/workflows/setups/back-end-setup

        # - uses: ./.github/workflows/setups/back-end-Unit
        #   if: ${{ matrix.Plan == 'Unit' }}

        - uses: ./.github/workflows/setups/back-end-Contract
          if: ${{ matrix.Plan == 'Contract' }}

          with: 
            dbname: $dbname
            dbuser: $dbuser
            dbpassword: $dbpassword
            TWILIOACCOUNTSID: ${{secrets.TWILIOACCOUNTSID}}
            TWILIOAUTHTOKEN: ${{secrets.TWILIOAUTHTOKEN}}
            TWILIOMESSAGINGSERVICESID: ${{secrets.TWILIOMESSAGINGSERVICESID}}
            ENCRYPTIONPASSPHRASE: ${{secrets.ENCRYPTIONPASSPHRASE}}
            ENCRYPTIONINITVECTOR: ${{secrets.ENCRYPTIONINITVECTOR}}
            PUSHNOTIFICATIONTESTDEVICETOKENID: ${{secrets.PUSHNOTIFICATIONTESTDEVICETOKENID}}
            FIREBASESERVERKEY: ${{secrets.FIREBASESERVERKEY}}
            GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
