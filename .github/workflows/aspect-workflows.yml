name: Aspect

on:
  pull_request:
    # paths:
    #   - 
  workflow_dispatch:

jobs:
  fe-install:
    name: 'Front-end setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect
        uses: ./.github/workflows/setups/front-end-setup

  be-install:
    name: 'Backend setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect-backend
        uses: ./.github/workflows/setups/back-end-setup

  # fe-test:
