name: Aspect

on:
  pull_request:
    # paths:
    #   - 
  workflow_dispatch:

env:
    dbname: 'aspect'
    dbuser: 'root'
    dbpassword: 'root'
    rabbitUser: 'guest'
    rabbitPassword: 'guest'

jobs:
  fe-install:
    name: 'Front-end setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect
        uses: ./.github/workflows/setups/front-end-setup

  fe-lint:
    name: 'Lint Front-end'
    runs-on: ubuntu-latest
    needs: fe-install
    steps:
      - uses: actions/checkout@v3
      - name: Clone and install backend environment
        uses: ./.github/workflows/setups/back-end-setup

      - name: Lint code
        run: |
          yarn web:lint

  fe-test:
    name: 'Front-end tests'
    runs-on: ubuntu-latest
    needs: fe-lint
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect
        uses: ./.github/workflows/setups/front-end-setup

      - name: 'Run Tests'
        run: yarn web:test

  be-install:
    name: 'Backend setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Clone and install backend environment
        uses: ./.github/workflows/setups/back-end-setup

  be-lint:
    name: 'Lint Backend'
    runs-on: ubuntu-latest
    needs: be-install
    steps:
      - uses: actions/checkout@v3
      - name: Clone and install backend environment
        uses: ./.github/workflows/setups/back-end-setup

      - name: Lint code
        run: |
          yarn api:lint

  be-unit-test: 
    name: 'Run Unit Tests'
    runs-on: ubuntu-latest
    needs: be-lint
    steps:

      - name: Setup MySQL
        uses: haltuf/mysql-action@master
        with:
          character set server: 'utf8'
          collation server: 'utf8_general_ci'
          mysql version: '8.0'
          mysql database: ${{ env.dbname }}
          mysql root password: ${{ env.dbpassword }}
          authentication plugin: 'mysql_native_password'

      - name: 'Setup RabbitMQ'
        uses: mer-team/rabbitmq-mng-action@v1.2
        with:
          RABBITMQ_USER: $rabbitUser
          RABBITMQ_PASS: $rabbitPassword
          RABBITMQ_PORT: 5672
          RABBITMQ_MNG_PORT: 15672
          RABBITMQ_TAG: '3-management-alpine'

      - uses: actions/checkout@v3

      - name: Clone and install backend environment
        uses: ./.github/workflows/setups/back-end-setup

      - name: Create .env file
        uses: ./.github/workflows/setups/back-end-env
        with: 
          dbname: ${{ env.dbname }}
          dbuser: ${{ env.dbuser }}
          dbpassword: ${{ env.dbpassword }}
          TWILIOACCOUNTSID: ${{secrets.TWILIOACCOUNTSID}}
          TWILIOAUTHTOKEN: ${{secrets.TWILIOAUTHTOKEN}}
          TWILIOMESSAGINGSERVICESID: ${{secrets.TWILIOMESSAGINGSERVICESID}}
          ENCRYPTIONPASSPHRASE: ${{secrets.ENCRYPTIONPASSPHRASE}}
          ENCRYPTIONINITVECTOR: ${{secrets.ENCRYPTIONINITVECTOR}}
          PUSHNOTIFICATIONTESTDEVICETOKENID: ${{secrets.PUSHNOTIFICATIONTESTDEVICETOKENID}}
          FIREBASESERVERKEY: ${{secrets.FIREBASESERVERKEY}}

      - name: 'Seed DB & Run Migrations'
        run: yarn start:api:seed
        shell: bash

      - name: 'Run Server'
        run: yarn start:api:bg
        shell: bash

      - name: 'Run API Unit Tests'
        run: yarn api:unit
        shell: bash

      - name: 'Stop Server'
        run: yarn stop:api:bg

  be-contract-test: 
    name: 'Run Contract Tests'
    runs-on: ubuntu-latest
    needs: be-lint
    steps:

      - name: Setup MySQL
        uses: haltuf/mysql-action@master
        with:
          character set server: 'utf8'
          collation server: 'utf8_general_ci'
          mysql version: '8.0'
          mysql database: ${{ env.dbname }}
          mysql root password: ${{ env.dbpassword }}
          authentication plugin: 'mysql_native_password'

      - name: 'Setup RabbitMQ'
        uses: mer-team/rabbitmq-mng-action@v1.2
        with:
          RABBITMQ_USER: $rabbitUser
          RABBITMQ_PASS: $rabbitPassword
          RABBITMQ_PORT: 5672
          RABBITMQ_MNG_PORT: 15672
          RABBITMQ_TAG: '3-management-alpine'

      - uses: actions/checkout@v3

      - name: Clone and install backend environment
        uses: ./.github/workflows/setups/back-end-setup

      - name: Create .env file
        uses: ./.github/workflows/setups/back-end-env
        with: 
          dbname: ${{ env.dbname }}
          dbuser: ${{ env.dbuser }}
          dbpassword: ${{ env.dbpassword }}
          TWILIOACCOUNTSID: ${{secrets.TWILIOACCOUNTSID}}
          TWILIOAUTHTOKEN: ${{secrets.TWILIOAUTHTOKEN}}
          TWILIOMESSAGINGSERVICESID: ${{secrets.TWILIOMESSAGINGSERVICESID}}
          ENCRYPTIONPASSPHRASE: ${{secrets.ENCRYPTIONPASSPHRASE}}
          ENCRYPTIONINITVECTOR: ${{secrets.ENCRYPTIONINITVECTOR}}
          PUSHNOTIFICATIONTESTDEVICETOKENID: ${{secrets.PUSHNOTIFICATIONTESTDEVICETOKENID}}
          FIREBASESERVERKEY: ${{secrets.FIREBASESERVERKEY}}

      - name: 'Seed DB & Run Migrations'
        run: yarn start:api:seed
        shell: bash

      - name: 'Run Server'
        run: yarn start:api:bg
        shell: bash

      - name: 'Run API Contract Tests'
        run: yarn api:contract
        shell: bash

      - name: 'Contract Test Report'
        uses: dorny/test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        if: success() || failure()
        with:
          name: Contract Tests
          path: 'api/contract-test-results.json'
          reporter: mocha-json
          token: $GITHUB_TOKEN

      - name: 'Stop Server'
        run: yarn stop:api:bg

