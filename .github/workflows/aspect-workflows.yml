name: Checks

on:
  workflow_dispatch:
  pull_request:

env:
  dbname: 'aspect'
  dbuser: 'root'
  dbpassword: 'root'
  dbseedfolder: './seeds/test'
  rabbitUser: 'guest'
  rabbitPassword: 'guest'

jobs:
  check-web-changes:
    name: 'Check Changes (WEB)'
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      web-changed: ${{ steps.filter.outputs.web-changed }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            web-changed:
              - './web/**'

  check-api-changes:
    name: 'Check Changes (API)'
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      api-changed: ${{ steps.filter.outputs.api-changed }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            api-changed:
              - './api/**'

  fe-lint:
    name: 'Lint (WEB)'
    runs-on: ubuntu-latest
    needs: check-web-changes
    steps:
      - uses: actions/checkout@v3
      - name: Clone and install backend environment
        if: ${{ needs.check-web-changes.outputs.web-changed == 'true' }}
        uses: ./.github/workflows/setups/front-end-setup
   
      - name: Lint code
        if: ${{ needs.check-web-changes.outputs.web-changed == 'true' }}
        run: |
          yarn web:lint --max-warnings=0

  fe-test:
    name: 'Tests (WEB)'
    runs-on: ubuntu-latest
    needs: [fe-lint, check-web-changes]
    if: ${{ needs.check-web-changes.outputs.web-changed == 'true' }}
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect
        uses: ./.github/workflows/setups/front-end-setup

      - name: 'Run Tests'
        run: yarn web:test

  be-lint:
    name: 'Lint (API)'
    runs-on: ubuntu-latest
    needs: check-api-changes
    steps:
      - uses: actions/checkout@v3
      - name: Clone and install backend environment
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        uses: ./.github/workflows/setups/back-end-setup

      - name: Lint code
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        run: |
          yarn api:lint --max-warnings=0

  be-unit-test:
    name: 'Unit Tests (API)'
    runs-on: ubuntu-latest
    needs: [be-lint, check-api-changes]
    steps:
      - uses: actions/checkout@v3
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}

      - name: Clone and install backend environment
        uses: ./.github/workflows/setups/back-end-setup
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}

      - name: Create .env file
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        run: |
          cp ./api/.env.example ./api/.env

      - name: 'Run API Unit Tests'
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        run: yarn api:unit
        shell: bash

      - name: 'Unit Test Report'
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        uses: dorny/test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        with:
          name: Unit Tests Report
          path: 'api/unit-test-results.json'
          reporter: mocha-json
          fail-on-error: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

  be-contract-chunks:
    name: 'Chunk Contract Tests (API)'
    runs-on: ubuntu-latest
    needs: [be-lint, check-api-changes]
    outputs:
      test-chunks: ${{ steps['set-test-chunks'].outputs['test-chunks'] }}
    steps:
      - uses: actions/checkout@v3

      - name: Run install
        run: |
          yarn install

      - id: set-test-chunks
        name: Set Chunks
        run: echo "::set-output name=test-chunks::$(node ./api/test/ciFindAllTests.js arrayAllTests --path './api/test/')"
        env:
          CHUNKS: ${{ steps['set-test-chunks'].outputs['test-chunks'] }}

  be-contract-test:
    name: 'Contract Tests (API) - (chunk ${{ strategy.job-index }})'
    runs-on: ubuntu-latest
    needs: [be-contract-chunks, check-api-changes]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.dbpassword }}
          MYSQL_DATABASE: ${{ env.dbname }}
        ports:
          - 3306:3306
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.rabbitUser }}
          RABBITMQ_DEFAULT_PASS: ${{ env.rabbitPassword }}
        ports:
          - 5672:5672
          - 15672:15672
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.be-contract-chunks.outputs.test-chunks) }}
    steps:
      - name: Wait for MySQL and configure authentication
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 3
          done
          mysql -h 127.0.0.1 -u root -proot -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;"

      - uses: actions/checkout@v3
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}

      - name: Clone and install backend environment
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        uses: ./.github/workflows/setups/back-end-setup

      - name: Create .env file
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        uses: ./.github/workflows/setups/back-end-env
        with:
          dbname: ${{ env.dbname }}
          dbuser: ${{ env.dbuser }}
          dbpassword: ${{ env.dbpassword }}
          countryName: US
          dbseedfolder: ${{ env.dbseedfolder }}
          TWILIOACCOUNTSID: ${{secrets.TWILIOACCOUNTSID}}
          TWILIOAUTHTOKEN: ${{secrets.TWILIOAUTHTOKEN}}
          TWILIOMESSAGINGSERVICESID: ${{secrets.TWILIOMESSAGINGSERVICESID}}
          ENCRYPTIONPASSPHRASE: ${{secrets.ENCRYPTIONPASSPHRASE}}
          ENCRYPTIONINITVECTOR: ${{secrets.ENCRYPTIONINITVECTOR}}
          PUSHNOTIFICATIONTESTDEVICETOKENID: ${{secrets.PUSHNOTIFICATIONTESTDEVICETOKENID}}
          FIREBASESERVERKEY: ${{secrets.FIREBASESERVERKEY}}

      - name: 'Seed DB & Run Migrations'
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        run: yarn start:api:seed
        shell: bash

      - name: 'Run API Contract Tests'
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        run: |
          yarn install
          yarn api:contract --spec ${{ matrix.chunk }}
        env:
          CHUNKS: ${{ needs.be-contract-chunks.outputs['test-chunks'] }}
        shell: bash

      - name: 'Contract Test Report'
        uses: dorny/test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        if: ${{ needs.check-api-changes.outputs.api-changed == 'true' }}
        with:
          name: 'Contract Tests Report - (chunk ${{ strategy.job-index }})'
          path: 'api/contract-test-results.json'
          reporter: mocha-json
          fail-on-error: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

  check-api-migrations-changes:
    name: 'Check Changes (API Migrations)'
    runs-on: ubuntu-latest
    needs: be-lint
    # Required permissions
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      api-migrations-changed: ${{ steps.filter.outputs.api-migrations-changed }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            api-migrations-changed:
              - './api/migrations/**'
              - './api/seeds/**'

  run-migration-test:
    name: 'Migration Tests (API) - (seed ${{ matrix.seed }})'
    runs-on: ubuntu-latest
    needs: [check-api-migrations-changes]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.dbpassword }}
          MYSQL_DATABASE: ${{ env.dbname }}
        ports:
          - 3306:3306
    strategy:
      fail-fast: false
      matrix:
        # find seeds -mindepth 1 -maxdepth 1 -type d ! -path "seeds/relatedObjects" ! -path "seeds/test" ! -path "seeds/daily_new_results" ! -path "seeds/zz_shared" ! -path "seeds/fixtures" ! -path "seeds/common" ! -path "seeds/scripts"
        seed: ['./seeds/pakistan','./seeds/bangladesh','./seeds/ukraine','./seeds/png','./seeds/tanzania','./seeds/nigeria','./seeds/angola','./seeds/eswatini','./seeds/ghana','./seeds/zimbabwe','./seeds/malawi','./seeds/myanmar','./seeds/mozambique','./seeds/development','./seeds/lesotho','./seeds/chad']
    steps:
      - name: Wait for MySQL and configure authentication
        if: ${{ needs.check-api-migrations-changes.outputs.api-migrations-changed == 'true' }}
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 3
          done
          mysql -h 127.0.0.1 -u root -proot -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;"

      - uses: actions/checkout@v3
        if: ${{ needs.check-api-migrations-changes.outputs.api-migrations-changed == 'true' }}

      - name: Clone and install backend environment
        if: ${{ needs.check-api-migrations-changes.outputs.api-migrations-changed == 'true' }}
        uses: ./.github/workflows/setups/back-end-setup

      - name: Create .env file
        if: ${{ needs.check-api-migrations-changes.outputs.api-migrations-changed == 'true' }}
        uses: ./.github/workflows/setups/back-end-env
        with:
          dbname: ${{ env.dbname }}
          dbuser: ${{ env.dbuser }}
          dbpassword: ${{ env.dbpassword }}
          dbseedfolder: ${{ matrix.seed }}
          TWILIOACCOUNTSID: ${{secrets.TWILIOACCOUNTSID}}
          TWILIOAUTHTOKEN: ${{secrets.TWILIOAUTHTOKEN}}
          TWILIOMESSAGINGSERVICESID: ${{secrets.TWILIOMESSAGINGSERVICESID}}
          ENCRYPTIONPASSPHRASE: ${{secrets.ENCRYPTIONPASSPHRASE}}
          ENCRYPTIONINITVECTOR: ${{secrets.ENCRYPTIONINITVECTOR}}
          PUSHNOTIFICATIONTESTDEVICETOKENID: ${{secrets.PUSHNOTIFICATIONTESTDEVICETOKENID}}
          FIREBASESERVERKEY: ${{secrets.FIREBASESERVERKEY}}

      - name: 'Seed DB & Run Migrations'
        if: ${{ needs.check-api-migrations-changes.outputs.api-migrations-changed == 'true' }}
        run: yarn start:api:seed
        shell: bash
