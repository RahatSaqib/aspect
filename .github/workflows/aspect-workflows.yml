  workflow_dispatch:

env:
    dbname: 'aspect'
    dbuser: 'root'
    dbpassword: 'rootpass'
    rabbitUser: 'guest'
    rabbitPassword: 'guest'

jobs:
  fe-install:
    name: 'Front-end setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect
        uses: ./.github/workflows/setups/front-end-setup

  be-install:
    name: 'Backend setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect-backend
        uses: ./.github/workflows/setups/back-end-setup

