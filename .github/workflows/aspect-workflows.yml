name: Checks

on:
  pull_request:
  workflow_dispatch:

env:
  dbname: "aspect"
  dbuser: "root"
  dbpassword: "root"
  rabbitUser: "guest"
  rabbitPassword: "guest"

jobs:
  fe-lint:
    name: "Lint (WEB)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Clone and install backend environment
        uses: ./.github/workflows/setups/front-end-setup

      - name: Lint code
        run: |
          yarn web:lint

  fe-test:
    name: "Tests (WEB)"
    runs-on: ubuntu-latest
    needs: fe-lint
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect
        uses: ./.github/workflows/setups/front-end-setup

      - name: "Run Tests"
        run: yarn web:test

  be-lint:
    name: "Lint (API)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Clone and install backend environment
        uses: ./.github/workflows/setups/back-end-setup

      - name: Lint code
        run: |
          yarn api:lint

  be-unit-test:
    name: "Unit Tests (API)"
    runs-on: ubuntu-latest
    needs: be-lint
    steps:
      - name: Setup MySQL
        uses: haltuf/mysql-action@master
        with:
          character set server: "utf8"
          collation server: "utf8_general_ci"
          mysql version: "8.0"
          mysql database: ${{ env.dbname }}
          mysql root password: ${{ env.dbpassword }}
          authentication plugin: "mysql_native_password"

      - name: "Setup RabbitMQ"
        uses: mer-team/rabbitmq-mng-action@v1.2
        with:
          RABBITMQ_USER: $rabbitUser
          RABBITMQ_PASS: $rabbitPassword
          RABBITMQ_PORT: 5672
          RABBITMQ_MNG_PORT: 15672
          RABBITMQ_TAG: "3-management-alpine"

      - uses: actions/checkout@v3

      - name: Clone and install backend environment
        uses: ./.github/workflows/setups/back-end-setup

      - name: Create .env file
        uses: ./.github/workflows/setups/back-end-env
        with:
          dbname: ${{ env.dbname }}
          dbuser: ${{ env.dbuser }}
          dbpassword: ${{ env.dbpassword }}
          TWILIOACCOUNTSID: ${{secrets.TWILIOACCOUNTSID}}
          TWILIOAUTHTOKEN: ${{secrets.TWILIOAUTHTOKEN}}
          TWILIOMESSAGINGSERVICESID: ${{secrets.TWILIOMESSAGINGSERVICESID}}
          ENCRYPTIONPASSPHRASE: ${{secrets.ENCRYPTIONPASSPHRASE}}
          ENCRYPTIONINITVECTOR: ${{secrets.ENCRYPTIONINITVECTOR}}
          PUSHNOTIFICATIONTESTDEVICETOKENID: ${{secrets.PUSHNOTIFICATIONTESTDEVICETOKENID}}
          FIREBASESERVERKEY: ${{secrets.FIREBASESERVERKEY}}

      - name: "Seed DB & Run Migrations"
        run: yarn start:api:seed
        shell: bash

      - name: "Run Server"
        run: yarn start:api:bg
        shell: bash

      - name: "Run API Unit Tests"
        run: yarn api:unit
        shell: bash

      - name: "Unit Test Report"
        uses: dorny/test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        if: success() || failure()
        with:
          name: Unit Tests Report
          path: "api/unit-test-results.json"
          reporter: mocha-json
          fail-on-error: "false"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Stop Server"
        run: yarn stop:api:bg

  be-contract-chunks:
    name: "Chunk Contract Tests (API)"
    runs-on: ubuntu-latest
    needs: be-lint
    outputs:
      test-chunks: ${{ steps['set-test-chunks'].outputs['test-chunks'] }}
      test-chunk-ids: ${{ steps['set-test-chunk-ids'].outputs['test-chunk-ids'] }}
    steps:
      - uses: actions/checkout@v3

      - id: set-test-chunks
        name: Set Chunks
        run: |
          echo pwd
          echo ls -la
          echo "::set-output name=test-chunks::$(node ./api/test/ciFindAllTests.js | jq -cM '[_nwise(length / 3 | ceil)]')"
      - id: set-test-chunk-ids
        name: Set Chunk IDs
        run: echo "::set-output name=test-chunk-ids::$(echo $CHUNKS | jq -cM 'to_entries | map(.key)')"
        env:
          CHUNKS: ${{ steps['set-test-chunks'].outputs['test-chunks'] }}

  be-contract-test:
    name: "Contract Tests (API) - (chunk ${{ matrix.chunk }})"
    runs-on: ubuntu-latest
    needs: be-contract-chunks
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs['test-chunk-ids']) }}
    steps:
      - name: Setup MySQL
        uses: haltuf/mysql-action@master
        with:
          character set server: "utf8"
          collation server: "utf8_general_ci"
          mysql version: "8.0"
          mysql database: ${{ env.dbname }}
          mysql root password: ${{ env.dbpassword }}
          authentication plugin: "mysql_native_password"

      - name: "Setup RabbitMQ"
        uses: mer-team/rabbitmq-mng-action@v1.2
        with:
          RABBITMQ_USER: $rabbitUser
          RABBITMQ_PASS: $rabbitPassword
          RABBITMQ_PORT: 5672
          RABBITMQ_MNG_PORT: 15672
          RABBITMQ_TAG: "3-management-alpine"

      - uses: actions/checkout@v3

      - name: Clone and install backend environment
        uses: ./.github/workflows/setups/back-end-setup

      - name: Create .env file
        uses: ./.github/workflows/setups/back-end-env
        with:
          dbname: ${{ env.dbname }}
          dbuser: ${{ env.dbuser }}
          dbpassword: ${{ env.dbpassword }}
          TWILIOACCOUNTSID: ${{secrets.TWILIOACCOUNTSID}}
          TWILIOAUTHTOKEN: ${{secrets.TWILIOAUTHTOKEN}}
          TWILIOMESSAGINGSERVICESID: ${{secrets.TWILIOMESSAGINGSERVICESID}}
          ENCRYPTIONPASSPHRASE: ${{secrets.ENCRYPTIONPASSPHRASE}}
          ENCRYPTIONINITVECTOR: ${{secrets.ENCRYPTIONINITVECTOR}}
          PUSHNOTIFICATIONTESTDEVICETOKENID: ${{secrets.PUSHNOTIFICATIONTESTDEVICETOKENID}}
          FIREBASESERVERKEY: ${{secrets.FIREBASESERVERKEY}}

      - name: "Seed DB & Run Migrations"
        run: yarn start:api:seed
        shell: bash

      - name: "Run Server"
        run: yarn start:api:bg
        shell: bash

      - name: "Run API Contract Tests"
        run: echo $CHUNKS | jq '.[${{ matrix.chunk }}] | .[] | @text' | xargs yarn api:contract
        env:
          CHUNKS: ${{ needs.setup.outputs['test-chunks'] }}

      # - name: "Run API Contract Tests"
      #   run: yarn api:contract
      #   shell: bash

      # - name: "Contract Test Report"
      #   uses: dorny/test-reporter@v1
      #   env:
      #     GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      #   if: success() || failure()
      #   with:
      #     name: Contract Tests Report
      #     path: "api/contract-test-results.json"
      #     reporter: mocha-json
      #     fail-on-error: "false"
      #     token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Stop Server"
        run: yarn stop:api:bg
