name: Aspect

on:
  pull_request:
    # paths:
    #   - 
  workflow_dispatch:

jobs:
  fe-install:
    name: 'Front-end setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect
        uses: ./.github/workflows/setups/front-end-setup

  be-install:
    name: 'Backend setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: install-aspect-backend
        uses: ./.github/workflows/setups/back-end-setup

  # fe-test:
  #   name: 'Front-end tests'
  #   runs-on: ubuntu-latest
  #   needs: fe-install
  #   strategy:
  #     matrix:
  #       Plan: [Web]
  #   steps:
  #     - uses: actions/checkout@v3
  #     - id: install-aspect
  #       uses: ./.github/workflows/setups/front-end-setup

  #     - name: 'Run Tests'
  #       run: yarn web:test

  be-test:
    name: 'Back-end tests'
    runs-on: ubuntu-latest
    needs: be-install
    env:
      dbname: 'root'
      dbuser: 'rootpass'
      dbpassword: 'aspect'
      rabbitUser: 'guest'
      rabbitPassword: 'guest'
    strategy:
      matrix:
        Plan: [Unit,Contract]
    steps:
        - uses: actions/checkout@v3

        - uses: ./.github/workflows/setups/back-end-Unit
          if: ${{ matrix.Plan == 'Unit' }}

        - uses: ./.github/workflows/setups/back-end-Contract
          if: ${{ matrix.Plan == 'Contract' }}

          with: 
            dbname: $dbname
            dbuser: $dbuser
            dbpassword: $dbpassword
