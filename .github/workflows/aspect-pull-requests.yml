name: Front-end

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 'Build Aspect Front-end'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repo'
        uses: actions/checkout@v2

      - name: 'Setup NODE'
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - uses: actions/cache@v2
        with:
          path: |
            ./web/**/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('./web/**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-web

      - name: 'Install Node Modules'
        run: 'yarn start:web:install'

  test:
    name: 'Build Aspect Front-end'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 'Run Tests'
        run: yarn web:test
