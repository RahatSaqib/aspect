name: Build and Test Aspect Web on PR
'on': pull_request
jobs:
  Build-and-Test-Web:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repo'
        uses: actions/checkout@v2

      - name: 'Setup NODE'
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - uses: actions/cache@v2
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: 'Install Node Modules'
        run: 'yarn start:web:install'

