version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Disable version updates. Security updates will still create PRs
    open-pull-requests-limit: 10

  - package-ecosystem: 'npm'
    directory: '/api'
    schedule:
      interval: 'weekly'
    # Disable version updates. Security updates will still create PRs
    open-pull-requests-limit: 10

  - package-ecosystem: 'npm'
    directory: '/web'
    schedule:
      interval: 'weekly'
    # Disable version updates. Security updates will still create PRs
    open-pull-requests-limit: 0
