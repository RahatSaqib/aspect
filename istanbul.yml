instrumentation:
  excludes:
    - '*.test.jsx?'
    - 'webpack.config.js'
    - 'utils/*'
    - 'cfg/*'
    - 'dist/*'
  include-all-sources: true
reporting:
    print: detail
    reports:
        - lcov
    dir: 'coverage'
    summarizer: pkg
    report-config: {}
    watermarks:
        statements: [99,100]
        lines: [99,100]
        branches: [99,100]
        functions: [99,100]
#TODO: Cannot use check to enforce coverage because of a bug in Istanbul RE: https://github.com/gotwarlost/istanbul/issues/583
